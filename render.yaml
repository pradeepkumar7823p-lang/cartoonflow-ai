services:
  - type: web
    name: cartoonflow-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FAL_KEY
        sync: false
      - key: FAL_IMAGE_MODEL
        value: fal-ai/flux/dev
      - key: FAL_I2V_MODEL
        value: kling/v4/image-to-video
